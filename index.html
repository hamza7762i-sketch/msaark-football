<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSAARK FOOTBALL</title>
<style>
body{margin:0;background:#0a7a2e;font-family:Arial;text-align:center;color:white;overflow:hidden}
h1{margin:10px 0 0;font-size:28px;text-shadow:2px 2px 0 #000}
#score{font-size:22px;margin:5px}
#game{position:relative;width:100%;height:70vh;background:linear-gradient(#2ecc71,#0a7a2e);border-top:4px solid white;border-bottom:4px solid white;overflow:hidden}
#goal{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70%;height:120px;border:5px solid white;border-top:none;background:rgba(255,255,255,0.2)}
#keeper{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:50px;transition:left 0.3s}
#ball{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:50px;transition:all 0.5s}
button{padding:15px 25px;margin:8px;font-size:20px;border:none;border-radius:15px;background:#FFD700;font-weight:bold}
#msg{font-size:22px;margin:10px;min-height:30px}
</style>
</head>
<body>
<h1>⚽ MSAARK FOOTBALL</h1>
<div id="score">النقاط: <span id="pts">0</span> | المحاولات: <span id="try">0</span>/5</div>
<div id="game">
<div id="goal"></div>
<div id="keeper">🧤</div>
<div id="ball">⚽</div>
</div>
<div id="msg">اختر جهة التسديد!</div>
<button onclick="shoot('left')">⬅️ يسار</button>
<button onclick="shoot('center')">⬆️ وسط</button>
<button onclick="shoot('right')">يمين ➡️</button>
<br>
<button onclick="location.reload()" style="background:white">🔄 العب من جديد</button>
<script>
let pts=0, tries=0;
function shoot(dir){
if(tries>=5) return;
tries++;
document.getElementById('try').innerText=tries;
let keeperMove=['left','center','right'][Math.floor(Math.random()*3)];
let k=document.getElementById('keeper');
let b=document.getElementById('ball');
if(keeperMove=='left') k.style.left='25%';
if(keeperMove=='center') k.style.left='50%';
if(keeperMove=='right') k.style.left='75%';
if(dir=='left') b.style.left='25%';
if(dir=='center') b.style.left='50%';
if(dir=='right') b.style.left='75%';
b.style.bottom='110px';
setTimeout(()=>{
if(dir!==keeperMove){
pts+=10;
document.getElementById('pts').innerText=pts;
document.getElementById('msg').innerText='🎉 قووووول! +10';
}else{
document.getElementById('msg').innerText='🧤 الحارس صدها!';
}
setTimeout(()=>{b.style.left='50%';b.style.bottom='20px';},600);
if(tries>=5){
setTimeout(()=>{document.getElementById('msg').innerText='🏁 انتهت اللعبة! نقاطك: '+pts+' - شاركها!';},1000);
}
},600);
}
</script>
</body>
</html>
